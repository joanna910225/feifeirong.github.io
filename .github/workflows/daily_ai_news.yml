name: AI News Update (Mon/Wed/Fri)

on:
  schedule:
    - cron: '17 1 * * 1,3,5'  # Mon/Wed/Fri at 09:17 Asia/Shanghai (01:17 UTC)
  workflow_dispatch:
    inputs:
      force:
        description: Generate even when a briefing is less than 20 hours old
        required: false
        default: false
        type: boolean
      coverage_start_utc:
        description: Optional UTC start time, for example 2026-08-21T01:00:00Z
        required: false
        type: string
      coverage_end_utc:
        description: Optional UTC cutoff time, for example 2026-08-24T01:00:00Z
        required: false
        type: string
      editorial_leads:
        description: Optional source URLs or leads that must be investigated
        required: false
        type: string

concurrency:
  group: daily-ai-news
  cancel-in-progress: false

jobs:
  update-news:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.13'

      - name: Install dependencies
        run: pip install requests

      - name: Fetch bilingual AI news
        run: python fetch_ai_news.py
        env:
          OPENCODE_GO_API_KEY: ${{ secrets.OPENCODE_GO_API_KEY }}
          FORCE_GENERATE: ${{ inputs.force || 'false' }}
          COVERAGE_START_UTC: ${{ inputs.coverage_start_utc || '' }}
          COVERAGE_END_UTC: ${{ inputs.coverage_end_utc || '' }}
          EDITORIAL_LEADS: ${{ inputs.editorial_leads || '' }}

      - name: Commit and push changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add public/index.json public/news
          if git diff --cached --quiet; then
            echo "No generated changes to commit"
            exit 0
          fi
          git commit -m "Update bilingual AI news [$(date -u +%Y-%m-%d)]"
          git pull --rebase origin main
          git push
